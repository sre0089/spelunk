name: Bug Report
description: Report a reproducible problem with Spelunk.
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include commands, config snippets, model shape/layers, and dataset type when relevant.
      placeholder: |
        1. Run ...
        2. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Spelunk version
      placeholder: "spelunk --version"
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: Install method
      options:
        - pip install spelunk-ml
        - Homebrew
        - editable/source install
        - other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, PyTorch version, terminal, and any relevant dependency versions.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      render: text
    validations:
      required: false
