name: Feature Request
description: Suggest an improvement or workflow Spelunk should support.
title: "Feature: "
labels: ["enhancement"]
body:
  - type: textarea
    id: workflow
    attributes:
      label: Workflow
      description: What are you trying to do with learned representations or activations?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should Spelunk do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing tools, scripts, or workarounds you tried.
    validations:
      required: false
