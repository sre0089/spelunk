name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev,arrays,datasets,tui]"

      - name: Run privacy scan
        run: scripts/privacy_scan.sh

      - name: Run ruff
        run: python -m ruff check .

      - name: Run mypy
        run: python -m mypy

      - name: Run tests
        run: python -m pytest
